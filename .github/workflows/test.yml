---
name: Test

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rubocop_and_matrix:
    runs-on: ubuntu-24.04
    outputs:
      ruby: ${{ steps.ruby.outputs.versions }}
      latest_ruby: ${{ steps.latest_ruby.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rake rubocop
      - id: ruby
        uses: voxpupuli/ruby-version@be0467ce7366d206b2e87f5b7a032a030120b7cb # 2.0.0
      - id: latest_ruby
        name: Determine newest supported Ruby
        run: echo "version=$(echo '${{ steps.ruby.outputs.versions }}' | jq -r 'max_by(split(".") | map(tonumber))')" >> "$GITHUB_OUTPUT"

  rspec:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: RSpec - Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: spec tests
        run: bundle exec rake test:spec
      - name: Build gem
        run: gem build --strict --verbose *.gemspec

  docker:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: Docker on Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run acceptance tests
        run: bundle exec rake test:acceptance

  # Run Beaker itself inside a container talking to the host daemon, so the
  # test containers are siblings. Covers both connection routing modes:
  # gateway - in_container? detects /.dockerenv and connects via the bridge
  #           gateway and published ssh port
  # dind    - DOCKER_IN_DOCKER=true forces a direct connection to the test
  #           container's network IP
  beaker_in_container:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        mode: [gateway, dind]
    name: Docker - Beaker in container connection test (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Beaker in docker container
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ matrix.mode == 'dind' && '-e DOCKER_IN_DOCKER=true' || '' }} \
            ruby:${{ needs.rubocop_and_matrix.outputs.latest_ruby }} \
            bash -c 'bundle install && bundle exec rake test:acceptance'

  # Same as beaker_in_container, but with podman. The gateway mode exercises
  # the /run/.containerenv detection in in_container?.
  # Rootless podman publishes ports only in the host network namespace, so
  # they are not reachable at the bridge gateway from a sibling container and
  # gateway mode has to use rootful podman. dind mode connects to sibling IPs
  # directly, which rootless podman supports once the Beaker container joins
  # the default bridge network instead of the slirp4netns one a plain run gets.
  beaker_in_podman:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        mode: [gateway]
        attempt: [1, 2, 3]
    name: Podman - Beaker in container connection test (${{ matrix.mode }}) ${{ matrix.attempt }}
    timeout-minutes: 15
    steps:
      - name: Start podman
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start podman.socket
          systemctl start --user podman.socket
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Beaker in podman container
        run: |
          set -x
          sudo podman run --rm \
            -v "$PWD:/work" -w /work \
            -v /run/podman/podman.sock:/run/podman/podman.sock \
            -e DOCKER_HOST=unix:///run/podman/podman.sock \
            --network podman \
            --security-opt label=disable \
            ruby:${{ needs.rubocop_and_matrix.outputs.latest_ruby }} \
            timeout 300 bash -c 'bundle install --quiet && bundle exec rake test:acceptance' > beaker.log 2>&1 &
          bpid=$!
          for i in $(seq 1 60); do
            n=$(sudo podman ps --filter name=beaker- -q | wc -l)
            [ "$n" -ge 2 ] && break
            sleep 5
          done
          sleep 15
          echo "===== MID-RUN DIAG (containers=$n) ====="
          sudo podman ps
          sudo ss -tlnp | grep -vE ':22 |:53 ' || true
          for c in $(sudo podman ps --filter name=beaker- -q); do
            sudo podman inspect "$c" --format '{{.Name}} ip={{.NetworkSettings.IPAddress}} ports={{json .NetworkSettings.Ports}} bindings={{json .HostConfig.PortBindings}} netmode={{.HostConfig.NetworkMode}}'
          done
          ports=$(sudo podman ps --filter name=beaker- --format '{{.Ports}}' | grep -oE ':[0-9]+->' | tr -d ':>-' | sort -u | tr '\n' ' ')
          echo "published ports: $ports"
          for p in $ports; do
            echo "--- host banner probe 10.88.0.1:$p"; (timeout 5 nc 10.88.0.1 "$p" </dev/null | head -c 40 | od -c | head -3) || true
            echo "--- host banner probe 127.0.0.1:$p"; (timeout 5 nc 127.0.0.1 "$p" </dev/null | head -c 40 | od -c | head -3) || true
          done
          cat > probe.sh <<PROBE
          for p in $ports; do echo "--- sibling banner probe 10.88.0.1:\$p"; nc -w 5 10.88.0.1 \$p </dev/null | head -c 40 | od -c | head -3; done
          for ip in $(sudo podman ps --filter name=beaker- -q | xargs -r -n1 sudo podman inspect --format '{{.NetworkSettings.IPAddress}}' | tr '\n' ' '); do echo "--- sibling direct probe \$ip:22"; nc -w 5 \$ip 22 </dev/null | head -c 40 | od -c | head -3; done
          PROBE
          cat probe.sh
          sudo podman run --rm --network podman -v "$PWD/probe.sh:/probe.sh" alpine sh /probe.sh || true
          echo "===== nat rules ====="
          sudo iptables-save -t nat | grep -E 'NETAVARK|DOCKER'
          echo "===== nft nat counters ====="
          sudo nft list table ip nat 2>/dev/null | grep -E 'dport|dnat' || true
          echo "===== waiting for beaker ====="
          wait $bpid || rc=$?
          echo "beaker rc=${rc:-0}"
          sed -E 's/\x1b\[[0-9;]*m//g' beaker.log | grep -E 'connection at|Attempting ssh|unreachable|Beaker completed|Warning' | sed -E 's/opts: \{.*//' | head -20
          exit ${rc:-0}

  # verifies that podman service is a dropin replacement for docker
  podman:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: Podman on Ruby ${{ matrix.ruby }}
    steps:
      - name: Start podman
        run: |
          sudo systemctl stop docker.service docker.socket && systemctl start --user podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run acceptance tests
        run: bundle exec rake test:acceptance

  tests:
    if: always()
    needs:
      - rubocop_and_matrix
      - docker
      - beaker_in_container
      - beaker_in_podman
      - podman
      - rspec
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
