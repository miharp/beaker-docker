---
name: Test

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rubocop_and_matrix:
    runs-on: ubuntu-24.04
    outputs:
      ruby: ${{ steps.ruby.outputs.versions }}
      latest_ruby: ${{ steps.latest_ruby.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rake rubocop
      - id: ruby
        uses: voxpupuli/ruby-version@be0467ce7366d206b2e87f5b7a032a030120b7cb # 2.0.0
      - id: latest_ruby
        name: Determine newest supported Ruby
        run: echo "version=$(echo '${{ steps.ruby.outputs.versions }}' | jq -r 'max_by(split(".") | map(tonumber))')" >> "$GITHUB_OUTPUT"

  rspec:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: RSpec - Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: spec tests
        run: bundle exec rake test:spec
      - name: Build gem
        run: gem build --strict --verbose *.gemspec

  docker:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: Docker on Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run acceptance tests
        run: bundle exec rake test:acceptance

  # Run Beaker itself inside a container talking to the host daemon, so the
  # test containers are siblings. Covers both connection routing modes:
  # gateway - in_container? detects /.dockerenv and connects via the bridge
  #           gateway and published ssh port
  # dind    - DOCKER_IN_DOCKER=true forces a direct connection to the test
  #           container's network IP
  beaker_in_container:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        mode: [gateway, dind]
    name: Docker - Beaker in container connection test (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Beaker in docker container
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ matrix.mode == 'dind' && '-e DOCKER_IN_DOCKER=true' || '' }} \
            ruby:${{ needs.rubocop_and_matrix.outputs.latest_ruby }} \
            bash -c 'bundle install && bundle exec rake test:acceptance'

  # Same as beaker_in_container, but with podman. The gateway mode exercises
  # the /run/.containerenv detection in in_container?.
  # Rootless podman publishes ports only in the host network namespace, so
  # they are not reachable at the bridge gateway from a sibling container and
  # gateway mode has to use rootful podman. dind mode connects to sibling IPs
  # directly, which rootless podman supports once the Beaker container joins
  # the default bridge network instead of the slirp4netns one a plain run gets.
  beaker_in_podman:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        mode: [gateway, dind]
    name: Podman - Beaker in container connection test (${{ matrix.mode }})
    timeout-minutes: 15
    steps:
      - name: Start podman
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start podman.socket
          systemctl start --user podman.socket
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Beaker in podman container
        run: |
          set -x
          if [ "${{ matrix.mode }}" = gateway ]; then
            podman='sudo podman'
            socket=/run/podman/podman.sock
          else
            podman=podman
            socket="/run/user/$(id -u)/podman/podman.sock"
          fi
          podman --version
          $podman info --format '{{.Host.NetworkBackend}} {{.Host.NetworkBackendInfo.Version}} {{.Host.NetworkBackendInfo.Path}}'
          sudo iptables-save | grep -c . || true
          $podman run --rm \
            -v "$PWD:/work" -w /work \
            -v "$socket:/run/podman/podman.sock" \
            -e DOCKER_HOST=unix:///run/podman/podman.sock \
            --network podman \
            --security-opt label=disable \
            ${{ matrix.mode == 'dind' && '-e DOCKER_IN_DOCKER=true' || '' }} \
            ruby:${{ needs.rubocop_and_matrix.outputs.latest_ruby }} \
            timeout 240 bash -c 'bundle install --quiet && bundle exec rake test:acceptance' || rc=$?
          echo "beaker rc=${rc:-0}"
          echo "===== DIAG ====="
          $podman ps -a
          $podman network inspect podman
          ip -br addr
          sysctl net.bridge.bridge-nf-call-iptables net.ipv4.ip_forward || true
          for c in $($podman ps -q); do $podman inspect "$c" --format '{{.Name}} {{.NetworkSettings.IPAddress}} {{json .NetworkSettings.Ports}} {{.HostConfig.NetworkMode}}'; done
          ports=$($podman ps --format '{{.Ports}}' | grep -oE '0.0.0.0:[0-9]+' | cut -d: -f2 | sort -u)
          echo "published ports: $ports"
          for p in $ports; do nc -zvw3 127.0.0.1 "$p" || true; nc -zvw3 10.88.0.1 "$p" || true; done
          for ip in $($podman ps -q | xargs -r -n1 $podman inspect --format '{{.NetworkSettings.IPAddress}}'); do nc -zvw3 "$ip" 22 || true; done
          $podman run --rm --network podman alpine sh -c "ip addr; ip route; for p in $ports; do nc -zvw3 10.88.0.1 \$p; done; for ip in $($podman ps -q | xargs -r -n1 $podman inspect --format '{{.NetworkSettings.IPAddress}}' | tr '\n' ' '); do nc -zvw3 \$ip 22; done" || true
          echo "===== iptables-save ====="
          sudo iptables-save
          echo "===== nft ruleset (head) ====="
          sudo nft list ruleset 2>/dev/null | head -150 || true
          echo "===== conntrack ====="
          sudo conntrack -L 2>/dev/null | grep -E '10\.88' | head -20 || true
          exit ${rc:-0}

  # verifies that podman service is a dropin replacement for docker
  podman:
    runs-on: ubuntu-24.04
    needs: rubocop_and_matrix
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.rubocop_and_matrix.outputs.ruby) }}
    name: Podman on Ruby ${{ matrix.ruby }}
    steps:
      - name: Start podman
        run: |
          sudo systemctl stop docker.service docker.socket && systemctl start --user podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run acceptance tests
        run: bundle exec rake test:acceptance

  tests:
    if: always()
    needs:
      - rubocop_and_matrix
      - docker
      - beaker_in_container
      - beaker_in_podman
      - podman
      - rspec
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
